[package]
name = "webrunner"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "webrunner"
path = "src/main.rs"

[dependencies]
axum = "0.7"
axum-server = { version = "0.7", features = ["tls-rustls"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
rcgen = "0.13"
rustls-pemfile = "2"
regex = "1"
bcrypt = "0.15"
md-5 = "0.10"
sha1 = "0.10"
base64 = "0.22"
http-body-util = "0.1"
tower = "0.4"
bytes = "1"

[dev-dependencies]
tempfile = "3"
